<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: A; src: url(../node_modules/@fontsource-variable/anybody/files/anybody-latin-standard-normal.woff2); font-weight: 100 900; font-stretch: 50% 150%; }
  @font-face { font-family: A; src: url(../node_modules/@fontsource-variable/anybody/files/anybody-latin-ext-standard-normal.woff2); font-weight: 100 900; font-stretch: 50% 150%; unicode-range: U+0100-024F; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #17171a; font-family: A; overflow: hidden; }
  /* Obrazek udostępniania powtarza hero: papierowy arkusz w ramie z sadzy, znak z podpisem, imię w ciężkim,
     wąskim kroju i karminowe hasło. */
  .sheet { position: absolute; inset: 14px; border-radius: 30px; background: #e9e5de; color: #17171a; box-sizing: border-box; padding: 34px 56px 36px; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-variation-settings: 'wdth' 62, 'wght' 850; }
  .brand img { width: 66px; height: 44px; }
  .stack { font-size: 24px; font-variation-settings: 'wdth' 90, 'wght' 600; color: #5a564f; }
  .name { margin-top: auto; font-size: 232px; line-height: 0.84; letter-spacing: -0.005em; font-variation-settings: 'wdth' 58, 'wght' 850; }
  .role { margin-top: 14px; font-size: 76px; line-height: 0.98; color: #be2337; font-variation-settings: 'wdth' 58, 'wght' 850; }
  .foot { margin-top: 26px; padding-top: 16px; border-top: 2px solid rgb(23 23 26 / 0.4); display: flex; justify-content: space-between; font-size: 24px; font-variation-settings: 'wdth' 90, 'wght' 600; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #1e6b47; margin-right: 12px; }
</style>
</head>
<body>
<div class="sheet">
  <div class="head"><span class="brand"><img src="../public/brand/znak-klawiatura.svg" alt="" />damianocode</span><span class="stack">Next.js · TypeScript · PostgreSQL</span></div>
  <div class="name">Damian Ułaś</div>
  <div class="role">Buduję aplikacje. Ogarniam agentów.</div>
  <div class="foot"><span>Zamość · zdalnie</span><span><span class="dot"></span>Otwarty na projekty, B2B albo etat</span></div>
</div>
</body>
</html>
